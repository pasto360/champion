<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
<title>RANKIT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<script src="mobile.js" defer></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script>
  // Apply saved theme immediately to avoid flash
  (function(){
    var t = localStorage.getItem('rankit_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div class="page" id="page-profile">
  <header class="app-header">
    <div style="display:flex;align-items:center;">
      <div style="display:flex;align-items:flex-end;gap:2px;margin-right:8px;">
        <div style="width:7px;height:14px;border-radius:2px 2px 0 0;background:var(--gold2);"></div>
        <div style="width:7px;height:19px;border-radius:2px 2px 0 0;background:var(--gold);"></div>
        <div style="width:7px;height:10px;border-radius:2px 2px 0 0;background:#ead99a;"></div>
      </div>
      <span style="font-family:Georgia,serif;font-size:15px;letter-spacing:3px;color:var(--text);font-style:italic;">rank<em style="font-style:normal;color:var(--gold);">it</em></span>
    </div>
      
    <div class="right" style="gap:6px;">
      <button onclick="openMyProfile()" class="user-chip" title="Il mio profilo">
        <div class="user-chip-av" id="profile-nav-av">?</div>
        <span class="user-chip-name" id="profile-nav-username"></span>
      </button>
      <button class="hbtn-icon" onclick="openNotifPanel()" aria-label="Notifiche">
        <i class="ti ti-bell" aria-hidden="true"></i>
      </button>
      <button class="hbtn-icon" onclick="openFriendsPanel()" aria-label="Amici">
        <i class="ti ti-users" aria-hidden="true"></i>
      </button>
      <button class="hbtn-icon theme-toggle-btn" onclick="toggleTheme()" aria-label="Tema">
        <i class="ti ti-sun" aria-hidden="true"></i>
      </button>
      <div class="nav-vsep"></div>
      <button class="hbtn" onclick="window.location.href='index.html'">Home</button>
      <button class="hbtn" onclick="window.location.href='dashboard.html'">Dashboard</button>
      <button class="hbtn red" onclick="doLogout()">Esci</button>
    </div>
  </header>
  <div class="dash-container" style="max-width:560px;">
    <!-- Avatar + username -->
    <div style="display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;border:1px solid var(--border);padding:20px;margin-bottom:16px;">
      <div id="profile-avatar" style="width:52px;height:52px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-1px;"></div>
      <div style="flex:1;min-width:0;">
        <div id="profile-username" style="font-family:Georgia,serif;font-size:20px;font-weight:400;color:var(--text);"></div>
        <div id="profile-joined" style="font-size:12px;color:var(--muted);margin-top:2px;"></div>
      </div>
    </div>
    <!-- Bio -->
    <div id="profile-bio-section" style="background:var(--card);border-radius:3px;border:1px solid var(--border);padding:16px 18px;margin-bottom:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Bio</div>
      <div id="profile-bio-view" style="font-size:14px;color:var(--text);line-height:1.6;"></div>
      <div id="profile-bio-edit" style="display:none;">
        <textarea id="profile-bio-input" maxlength="200" rows="3" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button onclick="saveBio()" style="padding:7px 16px;background:var(--text);color:var(--card);border:none;border-radius:3px;font-size:12px;letter-spacing:.4px;cursor:pointer;">Salva</button>
          <button onclick="cancelBioEdit()" style="padding:7px 16px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:3px;font-size:12px;cursor:pointer;">Annulla</button>
        </div>
      </div>
      <button id="profile-bio-edit-btn" style="display:none;margin-top:8px;padding:5px 12px;background:var(--faint);color:var(--muted);border:none;border-radius:7px;font-size:12px;cursor:pointer;" onclick="editBio()">✏️ Modifica bio</button>
    </div>
    <!-- Stats -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;" id="profile-stats-row"></div>
    <!-- Badge -->
    <div style="background:var(--card);border-radius:3px;border:1px solid var(--border);padding:16px 18px;margin-bottom:12px);">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;">Badge</div>
      <div id="profile-badges"></div>
    </div>
    <!-- Campionati -->
    <div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px 18px;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;">Campionati</div>
      <div id="profile-champs-list"></div>
    </div>
  </div>
</div>

<!-- Notif panel -->
<div class="notif-panel" id="notif-panel"></div>
<!-- Friends panel -->
<div class="friends-panel" id="friends-panel"></div>

</body>
<script>window.IS_PROFILE_PAGE = true;</script>
<script src="app.js"></script>
</html>
